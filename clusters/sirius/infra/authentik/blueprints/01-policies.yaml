# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: policies
  labels:
    blueprints.goauthentik.io/description: "Expression policies for role-based access control"
entries:
  # Policy: Has role "audiobook"
  - model: authentik_policies_expression.expressionpolicy
    id: policy-has-role-audiobook
    state: present
    identifiers:
      name: Has role "audiobook"
    attrs:
      name: Has role "audiobook"
      expression: |
        if ak_is_group_member(request.user, name="audiobook"):
            return True
        ak_message("Contact admin to give permissions")
        return False

  # Policy: Has role "movie"
  - model: authentik_policies_expression.expressionpolicy
    id: policy-has-role-movie
    state: present
    identifiers:
      name: Has role "movie"
    attrs:
      name: Has role "movie"
      expression: |
        return ak_is_group_member(request.user, name="movie")

  # Policy: Has role "admin"
  - model: authentik_policies_expression.expressionpolicy
    id: policy-has-role-admin
    state: present
    identifiers:
      name: Has role "admin"
    attrs:
      name: Has role "admin"
      expression: |
        return ak_is_group_member(request.user, name="admin")

  # Policy: Has role "mdfileshare"
  - model: authentik_policies_expression.expressionpolicy
    id: policy-has-role-mdfileshare
    state: present
    identifiers:
      name: Has role "mdfileshare"
    attrs:
      name: Has role "mdfileshare"
      expression: |
        if ak_is_group_member(request.user, name="mdfileshare"):
            return True
        ak_message("Contact admin to give permissions")
        return False
