# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: groups
  labels:
    blueprints.goauthentik.io/description: "User groups for role-based access"
entries:
  - model: authentik_core.group
    id: group-user
    state: present
    identifiers:
      name: user
    attrs:
      name: user
      attributes: {}

  - model: authentik_core.group
    id: group-audiobookshelf
    state: present
    identifiers:
      name: audiobookshelf
    attrs:
      name: audiobookshelf
      parent: !KeyOf group-user
      attributes: {}

  - model: authentik_core.group
    id: group-admin
    state: present
    identifiers:
      name: admin
    attrs:
      name: admin
      attributes: {}

  - model: authentik_core.group
    id: group-audiobook
    state: present
    identifiers:
      name: audiobook
    attrs:
      name: audiobook
      attributes: {}

  - model: authentik_core.group
    id: group-mdfileshare
    state: present
    identifiers:
      name: mdfileshare
    attrs:
      name: mdfileshare
      attributes: {}

  - model: authentik_core.group
    id: group-movie
    state: present
    identifiers:
      name: movie
    attrs:
      name: movie
      attributes: {}
