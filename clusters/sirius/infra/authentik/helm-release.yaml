apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 5m
  timeout: 15m
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: authentik
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  values:
    server:
      replicas: 2
      ingress:
        enabled: false
      #   ingressClassName: nginx
      #   hosts:
      #     - login.moonblade.work
        # annotations:
        #   cert-manager.io/cluster-issuer: default-clusterissuer
        # tls:
        #   - hosts:
        #       - login.moonblade.work
        #     secretName: login-moonblade-tls

    blueprints:
      configMaps:
        - authentik-blueprints

    postgresql:
      enabled: true
      primary:
        persistence:
          enabled: true
          existingClaim: data-authentik-postgresql-0
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
    redis:
      enabled: false

    worker:
      env:
        - name: AUDIOBOOKSHELF_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: audiobookshelf.client_secret
        - name: GRAFANA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: grafana.client_secret
        - name: SEAFILE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: seafile.client_secret
        - name: IMMICH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: immich.client_secret
        - name: CALIBRE_WEB_AUTOMATED_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: calibre-web-automated.client_secret

  valuesFrom:
    - kind: Secret
      name: authentik-secrets
      valuesKey: authentik.secret_key
      targetPath: authentik.secret_key

    - kind: Secret
      name: authentik-secrets
      valuesKey: authentik.postgresql.password
      targetPath: authentik.postgresql.password

    - kind: Secret
      name: authentik-secrets
      valuesKey: authentik.postgresql.password
      targetPath: postgresql.auth.password

