# External: pdf.moonblade.work via Cloudflare tunnel → stirling-pdf directly (auth handled by OIDC)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stirling-pdf-external
  namespace: stirling-pdf
spec:
  parentRefs:
  - name: main-gateway
    namespace: nginx-gateway
    sectionName: http
  hostnames:
  - pdf.moonblade.work
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: stirling-pdf
      port: 80
---
# Internal: pdf.sirius.moonblade.work → stirling-pdf service directly
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stirling-pdf-internal-redirect
  namespace: stirling-pdf
spec:
  parentRefs:
  - name: main-gateway
    namespace: nginx-gateway
    sectionName: http
  hostnames:
  - pdf.sirius.moonblade.work
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stirling-pdf-internal
  namespace: stirling-pdf
spec:
  parentRefs:
  - name: main-gateway
    namespace: nginx-gateway
    sectionName: https
  hostnames:
  - pdf.sirius.moonblade.work
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: stirling-pdf
      port: 80
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: stirling-pdf-internal-dns
  namespace: stirling-pdf
spec:
  endpoints:
  - dnsName: pdf.sirius.moonblade.work
    recordTTL: 60
    recordType: CNAME
    targets:
    - gateway.sirius.moonblade.work
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: stirling-pdf-outer-dns
  namespace: stirling-pdf
spec:
  endpoints:
  - dnsName: pdf.moonblade.work
    recordTTL: 60
    recordType: CNAME
    targets:
    - 46b0a967-3b0f-493a-88e7-6f1cc9f8852b.cfargotunnel.com
    providerSpecific:
    - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
      value: 'true'
