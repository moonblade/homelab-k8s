apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      containers:
        - name: stirling-pdf
          image: stirlingtools/stirling-pdf:2.14.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: INSTALL_BOOK_AND_ADVANCED_HTML_OPS
              value: "false"
            - name: LANGS
              value: "en_GB"
            - name: SYSTEM_BACKENDURL
              value: "https://pdf.moonblade.work"
            # Security / OIDC
            - name: DOCKER_ENABLE_SECURITY
              value: "true"
            - name: SECURITY_ENABLELOGIN
              value: "true"
            - name: SECURITY_LOGINMETHOD
              value: "all"
            - name: SECURITY_OAUTH2_ENABLED
              value: "true"
            - name: SECURITY_OAUTH2_PROVIDER
              value: "authentik"
            - name: SECURITY_OAUTH2_ISSUER
              value: "https://login.moonblade.work/application/o/stirling-pdf/"
            - name: SECURITY_OAUTH2_CLIENTID
              value: "stirling-pdf-homelab-oidc"
            - name: SECURITY_OAUTH2_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: stirling-pdf-oidc
                  key: client_secret
            - name: SECURITY_OAUTH2_SCOPES
              value: "openid, profile, email"
            - name: SECURITY_OAUTH2_USEASUSERNAME
              value: "preferred_username"
            - name: SECURITY_OAUTH2_AUTOCREATEUSER
              value: "true"
            - name: SECURITY_OAUTH2_BLOCKREGISTRATION
              value: "false"
            # Use internal cluster URL for JWKS to avoid external DNS timeout
            - name: SECURITY_OAUTH2_JWKS_URI
              value: "http://authentik-server.authentik.svc.cluster.local/application/o/stirling-pdf/jwks/"
          volumeMounts:
            - name: config
              mountPath: /configs
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: config
          nfs:
            server: nfs.sirius.local
            path: /mnt/primary/root/config/stirling-pdf
            readOnly: false
