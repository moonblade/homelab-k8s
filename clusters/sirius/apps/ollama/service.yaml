# Service without selector -- uses manual Endpoints to point to Ollama on Luna (NixOS VM 401, GPU passthrough)
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
      name: http
---
# Manual Endpoints pointing to Luna NixOS VM (192.168.1.199)
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  labels:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
subsets:
  - addresses:
      - ip: 192.168.1.199
    ports:
      - port: 11434
        protocol: TCP
        name: http
