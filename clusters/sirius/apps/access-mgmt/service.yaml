apiVersion: v1
kind: Service
metadata:
  name: access-mgmt
  labels:
    app.kubernetes.io/instance: access-mgmt
    app.kubernetes.io/name: access-mgmt
spec:
  selector:
    app.kubernetes.io/instance: access-mgmt
    app.kubernetes.io/name: access-mgmt
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
  type: ClusterIP
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: access-mgmt
  namespace: access-mgmt
spec:
  image: ghcr.io/moonblade/access-mgmt
  interval: 5m
  secretRef:
    name: access-mgmt-image-pull
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: access-mgmt
  namespace: access-mgmt
spec:
  imageRepositoryRef:
    name: access-mgmt
  filterTags:
    pattern: '^ts_(?P<ts>[0-9]+)$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: access-mgmt
  namespace: access-mgmt
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: "Automated image update: {{range .Changed.Changes}}{{print .OldValue}} -> {{println .NewValue}}{{end}}"
    push:
      branch: main
  update:
    path: ./clusters/sirius/apps/access-mgmt/deployment.yaml
    strategy: Setters
