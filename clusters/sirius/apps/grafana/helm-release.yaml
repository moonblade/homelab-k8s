apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: grafana
  namespace: grafana
spec:
  interval: 1h0m0s
  chart:
    spec:
      chart: grafana
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: grafana
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password

    persistence:
      enabled: true
      size: 10Gi

    initChownData:
      enabled: false

    securityContext:
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472

    resources:
      limits:
        memory: 1Gi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 100m

    grafana.ini:
      server:
        root_url: https://grafana.moonblade.work
      unified_alerting:
        enabled: true
      alerting:
        enabled: false
      auth.generic_oauth:
        enabled: true
        name: Authentik
        allow_sign_up: true
        client_id: grafana-homelab-oidc
        client_secret: $__file{/etc/secrets/grafana-oidc/client_secret}
        scopes: openid email profile groups
        auth_url: https://login.moonblade.work/application/o/authorize/
        token_url: https://login.moonblade.work/application/o/token/
        api_url: https://login.moonblade.work/application/o/userinfo/
        role_attribute_path: "contains(groups[*], 'admin') && 'Admin' || 'Viewer'"
        allow_assign_grafana_admin: true
        auto_login: true
      auth:
        disable_login_form: true

    extraSecretMounts:
      - name: grafana-oidc
        secretName: grafana-oidc
        defaultMode: 0440
        mountPath: /etc/secrets/grafana-oidc
        readOnly: true

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://loki.loki.svc.cluster.local:3100
            isDefault: true
            jsonData:
              maxLines: 1000
          - name: Prometheus
            type: prometheus
            url: http://prometheus-server.prometheus.svc.cluster.local
            access: proxy
            isDefault: false

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
          - name: infra-logs
            orgId: 1
            folder: "Infrastructure"
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/infra-logs
          - name: app-logs
            orgId: 1
            folder: "Applications"
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/app-logs
          - name: network-security
            orgId: 1
            folder: "Security"
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/network-security

    dashboardsConfigMaps:
      default: grafana-dashboards
      infra-logs: grafana-dashboard-infra-logs
      app-logs: grafana-dashboard-app-logs
      network-security: grafana-dashboard-network-security

    alerting:
      contactpoints.yaml:
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: Telegram via n8n
            receivers:
              - uid: telegram-n8n
                type: webhook
                settings:
                  url: http://n8n-main.n8n.svc.cluster.local:5678/webhook/grafana-alert
                  httpMethod: POST
                disableResolveMessage: false

      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: Telegram via n8n
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h

      rules.yaml:
        apiVersion: 1
        groups:
          - orgId: 1
            name: gateway-alerts
            folder: Security
            interval: 2m
            rules:
              - uid: nginx-5xx-spike
                title: High 5xx Error Rate
                condition: C
                data:
                  - refId: A
                    queryType: range
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: "P8E80F9AEF21F6940"
                    model:
                      expr: 'sum(count_over_time({namespace="nginx-gateway", container="nginx"} |~ " [5][0-9][0-9] " [5m]))'
                      queryType: range
                      refId: A
                      legendFormat: 5xx count
                  - refId: C
                    queryType: ""
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: __expr__
                    model:
                      conditions:
                        - evaluator:
                            params: [10]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: A
                      refId: C
                      type: threshold
                noDataState: NoData
                execErrState: Error
                for: 2m
                annotations:
                  summary: "High 5xx error rate on nginx gateway (check Grafana for count)"
                labels:
                  severity: warning
                isPaused: true

              - uid: authentik-auth-failures
                title: Authentik Auth Failures Spike
                condition: C
                data:
                  - refId: A
                    queryType: range
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: "P8E80F9AEF21F6940"
                    model:
                      expr: 'sum(count_over_time({namespace="authentik"} |~ "Login failed|authentication failed|Invalid credentials" [5m]))'
                      queryType: range
                      refId: A
                      legendFormat: auth failures
                  - refId: C
                    queryType: ""
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: __expr__
                    model:
                      conditions:
                        - evaluator:
                            params: [5]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: A
                      refId: C
                      type: threshold
                noDataState: NoData
                execErrState: Error
                for: 1m
                annotations:
                  summary: "Authentik auth failures spike detected (check Grafana for count)"
                labels:
                  severity: warning
                isPaused: true
