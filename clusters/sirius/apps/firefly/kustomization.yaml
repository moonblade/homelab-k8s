apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: firefly
resources:
  - helm-release.yaml
  - helm-repo.yaml
  - httproute.yaml
  - nfs-volumes.yaml
  - pico-deployment.yaml
  - pico-service.yaml
  - pico-httproute.yaml
  - pico-secret-sealed.yaml

configMapGenerator:
  - name: firefly-tracker-html
    options:
      disableNameSuffixHash: true
    files:
      - index.html.tmpl=pico-index.html.tmpl
      - nginx.conf=pico-nginx.conf
