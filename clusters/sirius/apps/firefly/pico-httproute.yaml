apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firefly-pico-external
  labels:
    app.kubernetes.io/instance: firefly-pico
    app.kubernetes.io/name: firefly-pico
spec:
  parentRefs:
    - name: main-gateway
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - pico.moonblade.work
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ak-outpost-firefly-pico
          namespace: authentik
          port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firefly-pico-internal
  labels:
    app.kubernetes.io/instance: firefly-pico
    app.kubernetes.io/name: firefly-pico
spec:
  parentRefs:
    - name: main-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - pico.sirius.moonblade.work
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: firefly-pico
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firefly-pico-internal-redirect
  labels:
    app.kubernetes.io/instance: firefly-pico
    app.kubernetes.io/name: firefly-pico
spec:
  parentRefs:
    - name: main-gateway
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - pico.sirius.moonblade.work
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: firefly-pico-internal-dns
  labels:
    app.kubernetes.io/instance: firefly-pico
    app.kubernetes.io/name: firefly-pico
spec:
  endpoints:
    - dnsName: pico.sirius.moonblade.work
      recordTTL: 60
      recordType: CNAME
      targets:
        - gateway.sirius.moonblade.work
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: firefly-pico-outer
  labels:
    app.kubernetes.io/instance: firefly-pico
    app.kubernetes.io/name: firefly-pico
spec:
  endpoints:
    - dnsName: pico.moonblade.work
      recordTTL: 60
      recordType: CNAME
      targets:
        - 46b0a967-3b0f-493a-88e7-6f1cc9f8852b.cfargotunnel.com
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: 'true'
