apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-pico
  labels:
    app.kubernetes.io/instance: firefly-pico
    app.kubernetes.io/name: firefly-pico
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: firefly-pico
      app.kubernetes.io/name: firefly-pico
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: firefly-pico
        app.kubernetes.io/name: firefly-pico
    spec:
      containers:
        - name: firefly-pico
          image: cioraneanu/firefly-pico:1.12.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: FIREFLY_URL
              value: "http://firefly-iii.firefly.svc.cluster.local"
            - name: TZ
              value: "Asia/Kolkata"
          volumeMounts:
            - name: data
              mountPath: /var/www/html/database/data
          livenessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: firefly-pico-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firefly-pico-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
