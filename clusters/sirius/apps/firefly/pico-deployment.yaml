apiVersion: v1
kind: ConfigMap
metadata:
  name: firefly-tracker-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firefly Tracker</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0d1117; --surface: #161b22; --border: #21262d;
        --text: #c9d1d9; --muted: #8b949e;
        --blue: #58a6ff; --green: #3fb950; --red: #f85149;
        --yellow: #d29922; --purple: #bc8cff; --orange: #ffa657;
      }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; font-size: 14px; }
      .header { display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
      .header h1 { font-size: 20px; color: var(--blue); font-weight: 700; }
      .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .month-nav { display: flex; align-items: center; gap: 8px; }
      .month-nav button { background: var(--surface); border: 1px solid var(--border);
        color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
      .month-nav button:hover { border-color: var(--blue); color: var(--blue); }
      .month-label { font-size: 14px; font-weight: 600; color: var(--text); min-width: 130px; text-align: center; }
      #status { font-size: 12px; color: var(--muted); }
      #status.err { color: var(--red); }
      .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
      .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
        padding: 12px 16px; flex: 1; min-width: 100px; }
      .stat .s-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
      .stat .s-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
      .c-blue { color: var(--blue); } .c-red { color: var(--red); }
      .c-yellow { color: var(--yellow); } .c-green { color: var(--green); }
      .main-grid { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
      @media (max-width: 700px) { .main-grid { grid-template-columns: 1fr; } }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
      .card-title { font-size: 11px; font-weight: 600; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
      .pie-wrap { position: relative; width: 200px; height: 200px; margin: 0 auto 12px; }
      #pieCanvas { width: 200px; height: 200px; display: block; }
      .pie-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
        text-align: center; pointer-events: none; }
      .pie-center .total-amt { font-size: 15px; font-weight: 700; color: var(--text); }
      .pie-center .total-lbl { font-size: 10px; color: var(--muted); }
      .legend { display: flex; flex-direction: column; gap: 4px; }
      .legend-item { display: flex; align-items: center; gap: 6px; cursor: pointer;
        padding: 3px 4px; border-radius: 4px; transition: background 0.1s; }
      .legend-item:hover { background: rgba(88,166,255,0.08); }
      .legend-item.dimmed { opacity: 0.3; }
      .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
      .legend-name { flex: 1; font-size: 12px; color: var(--text); overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
      .legend-amt { font-size: 11px; color: var(--muted); font-family: monospace; }
      .legend-pct { font-size: 10px; color: var(--muted); width: 32px; text-align: right; }
      .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
        border-bottom: 1px solid var(--border); padding-bottom: 8px; }
      .section-header h2 { font-size: 13px; font-weight: 600; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.4px; }
      .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
        background: var(--yellow); color: #0d1117; }
      .badge.ok { background: var(--green); }
      .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
      .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted);
        padding: 4px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; transition: all 0.15s; }
      .filter-btn.active { background: var(--blue); border-color: var(--blue);
        color: #0d1117; font-weight: 600; }
      .tx-list { display: flex; flex-direction: column; gap: 3px; }
      .tx-item { display: grid; grid-template-columns: 1fr auto; align-items: start;
        gap: 8px; padding: 9px 10px; border-radius: 7px; border: 1px solid transparent; }
      .tx-item:hover { background: rgba(88,166,255,0.04); border-color: var(--border); }
      .tx-item.uncat { border-left: 3px solid var(--yellow); padding-left: 8px; }
      .tx-item.ignored { opacity: 0.38; }
      .tx-desc { font-size: 13px; color: var(--text); font-weight: 500;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tx-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
      .tx-date { font-size: 11px; color: var(--muted); }
      .tx-cat { font-size: 11px; padding: 1px 6px; border-radius: 8px;
        background: rgba(88,166,255,0.12); color: var(--blue); font-weight: 500; }
      .tx-cat.none { background: rgba(210,153,34,0.15); color: var(--yellow); }
      .tx-tag-ign { font-size: 10px; padding: 1px 6px; border-radius: 8px;
        background: rgba(139,148,158,0.15); color: var(--muted); }
      .tx-right { display: flex; align-items: flex-start; gap: 8px; flex-shrink: 0; padding-top: 1px; }
      .tx-amount { font-size: 14px; font-weight: 600; font-family: monospace; color: var(--red); }
      .tx-actions { display: flex; gap: 4px; }
      .btn-sm { border: 1px solid var(--border); background: transparent; color: var(--muted);
        padding: 3px 8px; border-radius: 5px; cursor: pointer; font-size: 11px;
        transition: all 0.15s; white-space: nowrap; }
      .btn-sm:hover { border-color: var(--blue); color: var(--blue); }
      .btn-sm.ign { border-color: var(--muted); color: var(--muted); background: rgba(139,148,158,0.1); }
      .cat-picker { margin-top: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .cat-select { background: var(--bg); border: 1px solid var(--blue); color: var(--text);
        padding: 4px 8px; border-radius: 5px; font-size: 12px; cursor: pointer; max-width: 220px; }
      .btn-save { background: var(--blue); border: none; color: #0d1117;
        padding: 4px 12px; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: 600; }
      .btn-save:hover { opacity: 0.85; }
      .btn-cancel { background: none; border: 1px solid var(--border); color: var(--muted);
        padding: 4px 8px; border-radius: 5px; font-size: 12px; cursor: pointer; }
      .empty { color: var(--muted); text-align: center; padding: 32px; font-style: italic; font-size: 13px; }
      .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border);
        border-top-color: var(--blue); border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    </head>
    <body>
    <div class="header">
      <h1>💰 Firefly Tracker</h1>
      <div class="header-right">
        <div class="month-nav">
          <button id="prevMonth">‹</button>
          <span class="month-label" id="monthLabel"></span>
          <button id="nextMonth">›</button>
        </div>
        <span id="status"></span>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="s-label">Total Spent</div><div class="s-value c-blue" id="statTotal">—</div></div>
      <div class="stat"><div class="s-label">Uncategorized</div><div class="s-value c-yellow" id="statUncat">—</div></div>
      <div class="stat"><div class="s-label">Transactions</div><div class="s-value" id="statCount">—</div></div>
      <div class="stat"><div class="s-label">Ignored</div><div class="s-value" id="statIgnored">—</div></div>
    </div>
    <div class="main-grid">
      <div>
        <div class="card">
          <div class="card-title">Spending by Category</div>
          <div class="pie-wrap">
            <canvas id="pieCanvas" width="400" height="400"></canvas>
            <div class="pie-center">
              <div class="total-amt" id="pieCenterAmt">—</div>
              <div class="total-lbl">total</div>
            </div>
          </div>
          <div class="legend" id="legend"></div>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="section-header">
            <h2>Transactions</h2>
            <span class="badge" id="uncatBadge" style="display:none"></span>
          </div>
          <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="uncategorized">Uncategorized</button>
            <button class="filter-btn" data-filter="ignored">Ignored</button>
          </div>
          <div class="tx-list" id="txList"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>
    <script>
    const FIREFLY_URL   = "https://firefly.sirius.moonblade.work";
    const FIREFLY_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.eyJhdWQiOiIxIiwianRpIjoiMGFjMzdmYTBhM2JmYTcwMTAwOThjYjI3MTczZjBlMDgzZGQ1Y2ZmZTE4M2RlZWJiMzg2ZDdkY2Y3ZTU4OTY4YWQwOWE1NTc4ZTFkNmQzMGEiLCJpYXQiOjE3NzgzODA0NDguMzQwOTg5LCJuYmYiOjE3NzgzODA0NDguMzQwOTkxLCJleHAiOjE4MDk5MTY0NDguMjU2NzY3LCJzdWIiOiIxIiwic2NvcGVzIjpbXX0.Oy32142upF_xvinahSihCkmLKVZ0Vd4lt-X_Mto1qhjbn3kTsTRNB2MlYpAZUSSKpN7_5uV0D0iY1LmekSmPr1P5gLsa4FV3KQAmcVAUanBWpRLwON42o7SAHKjWfxRXm2S20Sp-OI6ZK8CsLB5QfdMw_JLYZtbI6iE2SCOtUQuxPqLPBpEa6keBpELSdV16W1MW3lSTHAuLuQtJnHYFEh_crOHnRhIQHFL0UDWIMK0A8eHwt_KQwbt8CeHs_CsoO03NAKESvyJAx5tAHJw0HF5zf1stB2uOWLg6PSuEfgLPdhCsxSIGZn-lYl96-1HsfnxRiTaU_aibs_fBladjQ8eVORl3nH9QyJ0z0xukD3_CaH88yHpnU15ZZxgR8BMVltkMvmUSyptNBmZuTUVhXFF6qJJLKOdB3sTG0ODw1ACLvV3G9U3PaDi1cuFNyRjuP65qvgJMSMZfzuesZhgnxD6mHSTjNzo5WfFun2kEUTzaiO826cSu20cVIZiR-_3aYKDtdA4IqP_P-362hgxp6pPO1emawkzhgYxh4Pq6Sza6XERx40yj4gEA4ShnFthg0KboJ7czOTBS4f5SPYSK4b11rMMQNdTqRc4DwyY3v-1sCfuRiuLxmcGA3eduFyhHppFV260jSa4HVbRtJ9qY6ERGJJY41ALLziAwMCr0Ed4";
    const COLORS = [
      "#58a6ff","#3fb950","#bc8cff","#ffa657","#79c0ff",
      "#56d364","#ff7b72","#e3b341","#d2a8ff","#ffb077",
      "#45b8ac","#c74375","#EFC050","#FF6F61",
    ];

    let currentDate = new Date();
    let allTx = [];
    let categories = [];
    let categoryNames = [];
    let activeFilter = "all";
    let activeLegendCat = null;
    let openPickerKey = null;

    function fmtINR(v) {
      if (v >= 100000) return "₹" + (v/100000).toFixed(1) + "L";
      if (v >= 1000)   return "₹" + (v/1000).toFixed(1) + "K";
      return "₹" + Math.round(v);
    }
    function esc(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function monthRange(d) {
      const y = d.getFullYear(), m = d.getMonth();
      const pad = n => String(n).padStart(2,"0");
      return { start: `${y}-${pad(m+1)}-01`, end: `${y}-${pad(m+1)}-${pad(new Date(y,m+1,0).getDate())}` };
    }
    function setStatus(msg, isErr) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = isErr ? "err" : "";
    }

    async function api(path, opts = {}) {
      const r = await fetch(FIREFLY_URL + path, {
        ...opts,
        headers: {
          Authorization: "Bearer " + FIREFLY_TOKEN,
          Accept: "application/vnd.api+json",
          "Content-Type": "application/json",
          ...(opts.headers || {}),
        },
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      if (opts.method === "PUT") return r.json().catch(() => ({}));
      return r.json();
    }

    async function fetchPages(path) {
      let results = [], page = 1;
      while (true) {
        const sep = path.includes("?") ? "&" : "?";
        const data = await api(path + sep + "page=" + page + "&limit=50");
        results = results.concat(data.data || []);
        const meta = data.meta && data.meta.pagination;
        if (!meta || page >= meta.total_pages) break;
        page++;
      }
      return results;
    }

    async function loadData() {
      setStatus("Loading…");
      const { start, end } = monthRange(currentDate);
      try {
        const [txRaw, catRaw] = await Promise.all([
          fetchPages("/api/v1/transactions?type=withdrawal&start=" + start + "&end=" + end),
          fetchPages("/api/v1/categories"),
        ]);
        categoryNames = catRaw.map(c => c.attributes.name).sort();
        allTx = [];
        for (const t of txRaw) {
          for (const s of t.attributes.transactions) {
            allTx.push({
              id: t.id,
              jid: String(s.transaction_journal_id),
              desc: s.description || "—",
              amount: parseFloat(s.amount),
              date: (s.date || "").substring(0, 10),
              category: s.category_name || null,
              tags: s.tags || [],
            });
          }
        }
        // Uncategorized (non-ignored) first, then date desc
        allTx.sort((a, b) => {
          const ai = (!a.category && !a.tags.includes("ignore")) ? 0 : 1;
          const bi = (!b.category && !b.tags.includes("ignore")) ? 0 : 1;
          if (ai !== bi) return ai - bi;
          return b.date.localeCompare(a.date);
        });
        buildCategories();
        render();
        setStatus("Updated " + new Date().toLocaleTimeString("en-IN", {hour:"2-digit",minute:"2-digit"}));
      } catch(e) {
        setStatus("Error: " + e.message, true);
      }
    }

    function buildCategories() {
      const map = {};
      for (const tx of allTx) {
        if (tx.tags.includes("ignore")) continue;
        const key = tx.category || "Uncategorized";
        map[key] = (map[key] || 0) + tx.amount;
      }
      const sorted = Object.entries(map).sort((a,b) => b[1]-a[1]);
      let colorIdx = 0;
      categories = sorted.map(([name, total]) => ({
        name, total,
        color: name === "Uncategorized" ? "#d29922" : COLORS[colorIdx++ % COLORS.length],
      }));
    }

    function render() {
      renderStats();
      drawPie();
      renderLegend();
      renderTxList();
    }

    function renderStats() {
      const active = allTx.filter(t => !t.tags.includes("ignore"));
      const total  = active.reduce((s,t) => s + t.amount, 0);
      const uncat  = active.filter(t => !t.category).length;
      const ign    = allTx.filter(t => t.tags.includes("ignore")).length;
      document.getElementById("statTotal").textContent  = fmtINR(total);
      document.getElementById("statUncat").textContent  = uncat;
      document.getElementById("statCount").textContent  = allTx.length;
      document.getElementById("statIgnored").textContent = ign;
      const badge = document.getElementById("uncatBadge");
      badge.style.display = "";
      if (uncat > 0) { badge.textContent = uncat; badge.className = "badge"; }
      else           { badge.textContent = "✓";   badge.className = "badge ok"; }
    }

    function drawPie() {
      const canvas = document.getElementById("pieCanvas");
      const ctx = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      const total = categories.reduce((s,c) => s + c.total, 0);
      if (!total) { document.getElementById("pieCenterAmt").textContent = "₹0"; return; }
      document.getElementById("pieCenterAmt").textContent = fmtINR(total);
      const cx = W/2, cy = H/2, outerR = W/2-10, innerR = outerR*0.54, GAP = 0.025;
      let angle = -Math.PI/2;
      for (const slice of categories) {
        const sweep = (slice.total/total)*Math.PI*2 - GAP;
        if (sweep <= 0) continue;
        const dimmed = activeLegendCat && activeLegendCat !== slice.name;
        ctx.beginPath();
        ctx.moveTo(cx + outerR*Math.cos(angle), cy + outerR*Math.sin(angle));
        ctx.arc(cx, cy, outerR, angle, angle+sweep);
        ctx.arc(cx, cy, innerR, angle+sweep, angle, true);
        ctx.closePath();
        ctx.fillStyle = dimmed ? slice.color + "33" : slice.color;
        ctx.fill();
        angle += sweep + GAP;
      }
    }

    function renderLegend() {
      const total = categories.reduce((s,c) => s + c.total, 0);
      const el = document.getElementById("legend");
      el.innerHTML = "";
      for (const cat of categories) {
        const pct = total > 0 ? Math.round((cat.total/total)*100) : 0;
        const item = document.createElement("div");
        item.className = "legend-item" + (activeLegendCat && activeLegendCat !== cat.name ? " dimmed" : "");
        item.innerHTML =
          '<span class="legend-dot" style="background:' + cat.color + '"></span>' +
          '<span class="legend-name">' + esc(cat.name) + '</span>' +
          '<span class="legend-amt">' + fmtINR(cat.total) + '</span>' +
          '<span class="legend-pct">' + pct + '%</span>';
        item.addEventListener("click", () => {
          activeLegendCat = activeLegendCat === cat.name ? null : cat.name;
          renderLegend(); drawPie(); renderTxList();
        });
        el.appendChild(item);
      }
    }

    function renderTxList() {
      const list = document.getElementById("txList");
      let filtered = [...allTx];
      if (activeFilter === "uncategorized") filtered = filtered.filter(t => !t.category && !t.tags.includes("ignore"));
      if (activeFilter === "ignored")       filtered = filtered.filter(t => t.tags.includes("ignore"));
      if (activeLegendCat) {
        const cf = activeLegendCat === "Uncategorized" ? null : activeLegendCat;
        filtered = filtered.filter(t => t.category === cf && !t.tags.includes("ignore"));
      }
      if (!filtered.length) { list.innerHTML = '<div class="empty">No transactions</div>'; return; }

      list.innerHTML = "";
      for (const tx of filtered) {
        const ign  = tx.tags.includes("ignore");
        const isOpen = openPickerKey === tx.jid;
        const div = document.createElement("div");
        div.className = "tx-item" + (!tx.category && !ign ? " uncat" : "") + (ign ? " ignored" : "");

        const catBadge = tx.category
          ? '<span class="tx-cat">' + esc(tx.category) + '</span>'
          : '<span class="tx-cat none">Uncategorized</span>';
        const ignBadge = ign ? '<span class="tx-tag-ign">ignored</span>' : "";

        let pickerHtml = "";
        if (isOpen) {
          const opts = categoryNames.map(c =>
            '<option value="' + esc(c) + '"' + (c === tx.category ? " selected" : "") + '>' + esc(c) + '</option>'
          ).join("");
          pickerHtml =
            '<div class="cat-picker">' +
            '<select class="cat-select" id="sel-' + tx.jid + '"><option value="">-- pick --</option>' + opts + '</select>' +
            '<button class="btn-save" onclick="saveCategory(\'' + tx.id + '\',\'' + tx.jid + '\')">Save</button>' +
            '<button class="btn-cancel" onclick="closePicker()">✕</button>' +
            '</div>';
        }

        div.innerHTML =
          '<div>' +
            '<div class="tx-desc">' + esc(tx.desc) + '</div>' +
            '<div class="tx-meta">' +
              '<span class="tx-date">' + tx.date + '</span>' +
              catBadge + ignBadge +
            '</div>' +
            pickerHtml +
          '</div>' +
          '<div class="tx-right">' +
            '<span class="tx-amount">−' + fmtINR(tx.amount) + '</span>' +
            '<div class="tx-actions">' +
              '<button class="btn-sm" title="Categorize" onclick="openPicker(\'' + tx.jid + '\')">🏷</button>' +
              '<button class="btn-sm' + (ign ? ' ign' : '') + '" title="' + (ign ? 'Un-ignore' : 'Ignore') + '" onclick="toggleIgnore(\'' + tx.id + '\',\'' + tx.jid + '\')">' +
              (ign ? '👁' : '🚫') + '</button>' +
            '</div>' +
          '</div>';
        list.appendChild(div);
      }
    }

    function openPicker(jid) { openPickerKey = jid; renderTxList(); }
    function closePicker()   { openPickerKey = null; renderTxList(); }

    async function saveCategory(txId, jid) {
      const sel = document.getElementById("sel-" + jid);
      const cat = sel && sel.value;
      if (!cat) return;
      try {
        setStatus("Saving…");
        await api("/api/v1/transactions/" + txId, {
          method: "PUT",
          body: JSON.stringify({ transactions: [{ transaction_journal_id: parseInt(jid), category_name: cat }] }),
        });
        const tx = allTx.find(t => t.jid === jid);
        if (tx) tx.category = cat;
        openPickerKey = null;
        buildCategories();
        render();
        setStatus("Saved ✓");
      } catch(e) { setStatus("Save failed: " + e.message, true); }
    }

    async function toggleIgnore(txId, jid) {
      const tx = allTx.find(t => t.jid === jid);
      if (!tx) return;
      const hasIgnore = tx.tags.includes("ignore");
      const newTags = hasIgnore ? tx.tags.filter(t => t !== "ignore") : [...tx.tags, "ignore"];
      try {
        setStatus("Updating…");
        await api("/api/v1/transactions/" + txId, {
          method: "PUT",
          body: JSON.stringify({ transactions: [{ transaction_journal_id: parseInt(jid), tags: newTags }] }),
        });
        tx.tags = newTags;
        buildCategories();
        render();
        setStatus(hasIgnore ? "Un-ignored ✓" : "Ignored ✓");
      } catch(e) { setStatus("Update failed: " + e.message, true); }
    }

    // Month nav
    document.getElementById("prevMonth").addEventListener("click", () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()-1, 1);
      updateMonthLabel(); loadData();
    });
    document.getElementById("nextMonth").addEventListener("click", () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 1);
      updateMonthLabel(); loadData();
    });
    function updateMonthLabel() {
      document.getElementById("monthLabel").textContent =
        currentDate.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
    }

    // Filter buttons
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        activeLegendCat = null;
        renderLegend(); drawPie(); renderTxList();
      });
    });

    updateMonthLabel();
    loadData();
    </script>
    </body>
    </html>
