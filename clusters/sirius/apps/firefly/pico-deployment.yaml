apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-pico
  labels:
    app.kubernetes.io/instance: firefly-pico
    app.kubernetes.io/name: firefly-pico
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: firefly-pico
      app.kubernetes.io/name: firefly-pico
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: firefly-pico
        app.kubernetes.io/name: firefly-pico
    spec:
      containers:
        - name: firefly-pico
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
