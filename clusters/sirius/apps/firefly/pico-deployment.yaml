apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-pico
  labels:
    app.kubernetes.io/instance: firefly-pico
    app.kubernetes.io/name: firefly-pico
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: firefly-pico
      app.kubernetes.io/name: firefly-pico
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: firefly-pico
        app.kubernetes.io/name: firefly-pico
    spec:
      initContainers:
        - name: envsubst
          image: nginx:1.27-alpine
          command:
            - sh
            - -c
            - envsubst '${FIREFLY_TOKEN}' < /tmpl/index.html.tmpl > /html/index.html
          env:
            - name: FIREFLY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: firefly-tracker-secret
                  key: FIREFLY_TOKEN
          volumeMounts:
            - name: tmpl
              mountPath: /tmpl
            - name: html
              mountPath: /html
      containers:
        - name: firefly-pico
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: tmpl
          configMap:
            name: firefly-tracker-html
            items:
              - key: index.html.tmpl
                path: index.html.tmpl
        - name: nginx-conf
          configMap:
            name: firefly-tracker-html
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: html
          emptyDir: {}
