---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-sync
  namespace: cert-sync
---
# ClusterRole to read the wildcard cert secret in nginx-gateway namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-sync-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["wildcard-external-cert"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-sync-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-sync-secret-reader
subjects:
  - kind: ServiceAccount
    name: cert-sync
    namespace: cert-sync
