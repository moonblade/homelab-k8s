# Immich HelmRelease using OCI chart
# https://github.com/immich-app/immich-charts
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 1h
  chart:
    spec:
      chart: immich
      version: "0.13.1"
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
  install:
    timeout: 15m
  upgrade:
    timeout: 15m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v1.134.0
              pullPolicy: IfNotPresent
            env:
              REDIS_HOSTNAME: "immich-valkey"
              IMMICH_MACHINE_LEARNING_URL: "http://immich-machine-learning:3003"
              DB_HOSTNAME: "immich-postgres"
              DB_USERNAME: "immich"
              DB_DATABASE_NAME: "immich"
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-secret
                    key: db-password
              TZ: "Asia/Kolkata"

    immich:
      persistence:
        library:
          existingClaim: immich-library-nfs

      # Store config as a Secret (not ConfigMap) since it contains OAuth credentials
      configurationKind: Secret
      existingConfiguration: immich-config

    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: docker.io/valkey/valkey
                tag: 9.1-alpine@sha256:a35428eba9043cc0b79dbe54100f0c92784f2de00ad09b01182bfb1c5c83d1bd
                pullPolicy: IfNotPresent
      persistence:
        data:
          enabled: true
          type: emptyDir

    server:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                pullPolicy: IfNotPresent

    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
                HF_XET_CACHE: /cache/huggingface-xet
                MPLCONFIGDIR: /cache/matplotlib-config
      persistence:
        cache:
          enabled: true
          type: emptyDir
