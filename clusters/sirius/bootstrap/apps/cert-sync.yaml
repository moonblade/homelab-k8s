apiVersion: v1
kind: Namespace
metadata:
  name: cert-sync
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-sync
  namespace: cert-sync
spec:
  path: clusters/sirius/apps/cert-sync
  interval: 15m
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
