apiVersion: v1
kind: Namespace
metadata:
  name: access-mgmt
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: access-mgmt
  namespace: access-mgmt
spec:
  path: clusters/sirius/apps/access-mgmt
  interval: 15m
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: access-mgmt
