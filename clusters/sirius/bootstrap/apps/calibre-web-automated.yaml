apiVersion: v1
kind: Namespace
metadata:
  name: calibre-web-automated
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: calibre-web-automated
  namespace: calibre-web-automated
spec:
  suspend: true
  path: clusters/sirius/apps/calibre-web-automated
  interval: 15m
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: calibre-web-automated
