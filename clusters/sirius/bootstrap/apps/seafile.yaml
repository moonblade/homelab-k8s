apiVersion: v1
kind: Namespace
metadata:
  name: seafile
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seafile
  namespace: seafile
spec:
  path: clusters/sirius/apps/seafile
  interval: 15m
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
